<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AR Fighters Voxel Viewer</title>
<style>
  :root{--bg:#1d2230;--panel:#2a3142;--txt:#f3f3f3;--acc:#f76826}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,sans-serif;overflow:hidden}
  #ui{position:fixed;top:12px;left:12px;right:12px;display:flex;flex-wrap:wrap;gap:8px;z-index:2}
  button{background:var(--panel);color:var(--txt);border:2px solid #444c60;border-radius:8px;padding:8px 12px;font-weight:600;cursor:pointer}
  button.on{border-color:var(--acc);background:#3a2a22}
  #hint{position:fixed;bottom:12px;left:12px;right:12px;font-size:13px;opacity:.75;z-index:2}
  canvas{display:block;width:100vw;height:100vh}
  canvas.pix{image-rendering:pixelated}
</style>
</head>
<body>
<div id="ui">
  <button data-show="mark" class="on">Mark</button>
  <button data-show="chelsea">Chelsea card (both foxes)</button>
  <button data-show="kit">Little fox</button>
  <button data-show="all">Battle: Mark vs Chelsea</button>
  <button id="pop">▶ Pop out of card</button>
  <button id="pix" class="on">Pixel filter</button>
  <button id="spin">Auto-rotate</button>
</div>
<div id="hint">Drag to orbit · scroll/pinch to zoom · characters built voxel-by-voxel from the card art colors</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// ---------- palette sampled from the cards ----------
const C = {
  // Mark
  mO:'#f76826', mOD:'#c94f17', mDark:'#ad4510', cream:'#feeba9', creamD:'#f2d98a',
  teal:'#32aba6', tealL:'#5fd0c6', black:'#0d0d12', white:'#ffffff', haloY:'#fdff03', haloRim:'#fffbd6',
  // Chelsea
  fO:'#f58845', fOD:'#e06a2c', kO:'#ff8643', fW:'#ffffff', fB:'#b8dcea', fBD:'#7fb3cf',
  brown:'#975640', dk:'#22142a', earIn:'#6b586c'
};

// ---------- tiny voxel toolkit ----------
function Part(){ return new Map(); }
const k=(x,y,z)=>x+','+y+','+z;
function set(p,x,y,z,c){ p.set(k(Math.round(x),Math.round(y),Math.round(z)),c); }
function box(p,x0,x1,y0,y1,z0,z1,c){ for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++)for(let z=z0;z<=z1;z++)set(p,x,y,z,c); }
function ell(p,cx,cy,cz,rx,ry,rz,c){
  for(let x=Math.floor(cx-rx);x<=Math.ceil(cx+rx);x++)for(let y=Math.floor(cy-ry);y<=Math.ceil(cy+ry);y++)for(let z=Math.floor(cz-rz);z<=Math.ceil(cz+rz);z++){
    const d=((x-cx)/rx)**2+((y-cy)/ry)**2+((z-cz)/rz)**2; if(d<=1)set(p,x,y,z,c);}
}
function paint(p,fn){ for(const [key,c] of p){ const [x,y,z]=key.split(',').map(Number); const n=fn(x,y,z,c); if(n)p.set(key,n);} }
// paint front-most voxel of column (x,y) (facing +z)
function front(p,x,y,c,depth=1){ let mz=-1e9; for(const key of p.keys()){const [a,b,z]=key.split(',').map(Number); if(a===x&&b===y&&z>mz)mz=z;} if(mz>-1e9){for(let d=0;d<depth;d++)if(p.has(k(x,y,mz-d)))p.set(k(x,y,mz-d),c);} return mz; }
// paint side-most voxel of column (x,y) on side s (+1 => +z, -1 => -z)
function side(p,x,y,s,c){ let best=null; for(const key of p.keys()){const [a,b,z]=key.split(',').map(Number); if(a===x&&b===y&&(best===null||z*s>best*s))best=z;} if(best!==null)p.set(k(x,y,best),c); return best; }

const geo=new THREE.BoxGeometry(1,1,1);
function mesh(p,pivot=[0,0,0]){
  const mat=new THREE.MeshLambertMaterial();
  const m=new THREE.InstancedMesh(geo,mat,p.size); const o=new THREE.Object3D(); const col=new THREE.Color(); let i=0;
  for(const [key,c] of p){const [x,y,z]=key.split(',').map(Number); o.position.set(x-pivot[0],y-pivot[1],z-pivot[2]); o.updateMatrix(); m.setMatrixAt(i,o.matrix); m.setColorAt(i,col.set(c)); i++;}
  m.castShadow=true; m.receiveShadow=true;
  const g=new THREE.Group(); g.add(m); g.position.set(...pivot); return g;
}

// ---------- MARK the crocodile (head toward -x) ----------
function buildMark(){
  const root=new THREE.Group();
  const body=Part(), head=Part(), tail=Part(), halo=Part();
  // body + belly
  ell(body,10,8,0,9,4.5,5,C.mO);
  paint(body,(x,y)=> y<=6 && x<16 ? C.cream : null);
  paint(body,(x,y,z)=> y<=5 && x<16 && Math.abs(z)>=4 ? C.creamD : null);
  // legs: chunky, with toes pointing forward
  for(const [lx,s] of [[3,1],[3,-1],[14,1],[14,-1]]){
    const z0=s>0?3:-6, z1=s>0?6:-3;
    box(body,lx,lx+3,1,5,z0,z1,s>0?C.mO:C.mOD);
    box(body,lx-2,lx+3,0,0,z0,z1,s>0?C.mO:C.mOD);
    for(const tz of [z0,z0+2,z1]) set(body,lx-3,0,tz,s>0?C.mO:C.mOD); // toes
    box(body,lx+1,lx+3,5,6,z0,z1,C.mDark); // shoulder crease
  }
  // back spikes (teal, two-tone)
  for(const sx of [9,13,17]){
    for(let h=0;h<4;h++){ const w=3-h; box(body,sx-w+1,sx+w-1,12+h,12+h,-1,1,h>=2?C.tealL:C.teal); }
  }
  // head
  ell(head,2,13,0,6,5,5,C.mO);
  paint(head,(x,y)=> y<=10 ? C.cream : null);
  // raised eye bumps on top of head
  for(const s of [1,-1]) ell(head,4,16.5,s*2.5,2.6,2.4,2.2,C.mO);
  // upper snout
  box(head,-14,-3,11,13,-3,3,C.mO);
  box(head,-11,-3,14,14,-2,2,C.mO);
  box(head,-16,-14,12,14,-3,3,C.mO);       // up-turned tip
  for(const s of [2,-2]) box(head,-16,-15,15,15,s,s,C.mO); // nostril bumps
  box(head,-16,-15,15,15,0,0,C.mDark);
  // lower jaw (cream, wide)
  box(head,-14,-1,8,10,-3,3,C.cream);
  ell(head,-1,9,0,5,3,4.6,C.cream);
  box(head,-14,-4,7,7,-2,2,C.creamD);
  // smile / lip line
  for(let x=-14;x<=1;x++) for(const s of [3,-3]) set(head,x,11,s,C.mDark);
  for(const s of [1,-1]){ set(head,2,12,s*4,C.mDark); set(head,3,13,s*5,C.mDark); }
  // tooth (white, hanging down)
  for(const s of [1,-1]){ box(head,-6,-5,9,10,s*4,s*4,C.white); }
  // eyes: big black, white glint, heavy brow
  for(const s of [1,-1]){
    const z=s*4;
    box(head,3,5,16,17,z,z,C.black); set(head,5,18,z,C.black);
    set(head,4,17,z+s,C.black); set(head,3,16,z+s,C.black); set(head,5,17,z+s,C.white);
    for(let x=2;x<=6;x++) set(head,x,19,s*3,C.mDark);
    box(head,2,6,19,19,-2,2,C.mO);
  }
  // tail (wags) — tapers and curls up at the tip like the card
  for(let t=0;t<=13;t++){
    const r=Math.max(0.9,3.6*(1-t/15)); const cy=7+(t>6?(t-6)*0.55:0)+(t>11?(t-11)*0.6:0);
    ell(tail,19+t,cy,0,0.8,r,r,C.mO);
  }
  paint(tail,(x,y)=> y<=5 && x<26 ? C.cream : null);
  for(const tx of [22,26]){ box(tail,tx-1,tx+1,11,11,0,0,C.teal); set(tail,tx,12,0,C.tealL); }
  // halo: flat ring, yellow with pale rim
  for(let x=-7;x<=7;x++)for(let z=-7;z<=7;z++){const d=Math.hypot(x,z*1.15); if(d>=3.2&&d<5.7)set(halo,x,0,z,C.haloY); else if(d>=5.7&&d<6.3)set(halo,x,0,z,C.haloRim);}

  const gb=mesh(body), gh=mesh(head,[6,10,0]), gt=mesh(tail,[19,7,0]), ga=mesh(halo);
  ga.position.set(2,23,0);
  root.add(gb,gh,gt,ga);
  root.userData={kind:'mark',head:gh,tail:gt,halo:ga,body:gb};
  // center & scale
  const inner=new THREE.Group(); inner.add(root); root.position.set(-6,0,0); inner.scale.setScalar(0.12);
  inner.userData=root.userData; return inner;
}

// ---------- CHELSEA (big) and the little fox (facing +z) ----------
function buildFox(kid){
  const O=kid?C.kO:C.fO;
  const root=new THREE.Group();
  const body=Part(), head=Part(), tail=Part();
  const bodyR=kid?[4,5.5,4]:[5,7,5], bodyY=kid?5.5:7;
  // sitting body + haunches
  ell(body,0,bodyY,-1,...bodyR,O);
  for(const s of [1,-1]) ell(body,s*(kid?3:4),kid?3:4,-1,kid?2.5:3,kid?3:4,kid?3.5:4.5,O);
  // white fluffy chest with blue shading on the shadow side
  ell(body,0,bodyY+(kid?2:3),kid?2:2.5,kid?3:4,kid?3.5:4.5,kid?2.2:3,C.fW);
  for(const s of [1,-1]) set(body,s*(kid?3:4),bodyY+(kid?4:6),kid?3:4,C.fW);
  paint(body,(x,y,z,c)=> c===C.fW && x<=-1 && y<bodyY+1 ? C.fB : null);
  paint(body,(x,y,z,c)=> c===C.fW && x<=-2 && y<bodyY-1 ? C.fBD : null);
  // front legs (brown socks, dark paws)
  const legTop=kid?5:7, legZ=kid?2:3;
  for(const s of [1,-1]){
    const x0=s>0?1:-(kid?2:3), x1=s>0?(kid?2:3):-1;
    box(body,x0,x1,0,legTop,legZ,legZ+1,O);
    paint(body,(x,y,z)=> x>=x0&&x<=x1&&z>=legZ&&z<=legZ+1&&y<=legTop-2 ? C.brown : null);
    box(body,x0,x1,0,0,legZ,legZ+2,C.dk);
    // back feet
    box(body,s*(kid?3:5)-1,s*(kid?3:5)+1,0,0,0,legZ,C.brown);
  }
  // head
  const hy=kid?13:17, hr=kid?[5,4.3,4.5]:[6,5,5];
  ell(head,0,hy,1,...hr,O);
  // white cheeks/lower face + spiky cheek fluff
  paint(head,(x,y,z)=> y<=hy-2 && z>=1 && Math.abs(x)>=1 ? C.fW : null);
  for(const s of [1,-1]){
    ell(head,s*(hr[0]-0.5),hy-2,1,2.5,2.2,2.6,C.fW);
    set(head,s*(hr[0]+2),hy-2,1,C.fW); set(head,s*(hr[0]+2),hy-3,0,C.fW); set(head,s*(hr[0]+1),hy-4,1,C.fW);
  }
  paint(head,(x,y,z,c)=> c===C.fW && x<0 && y<hy-2 ? C.fB : null);
  // muzzle, nose, smile
  box(head,-1,1,hy-3,hy-2,hr[2],hr[2]+1,C.fW);
  set(head,0,hy-2,hr[2]+2,C.dk);
  set(head,0,hy-4,hr[2],C.dk);
  // closed happy eyes ( ^ ^ )
  for(const s of [1,-1]){
    const pts=kid?[[1,0],[2,1],[3,0]]:[[1,0],[2,1],[3,1],[4,0]];
    for(const [dx,dy] of pts) front(head,s*dx,hy+dy,C.dk);
  }
  // blush-free forehead stripe of darker orange
  paint(head,(x,y,z,c)=> c===O && y>=hy+3 && z<=-2 ? C.fOD : null);
  // ears: tall, tilted out, orange outside, pale inner with blue
  const eh=kid?5:6;
  for(const s of [1,-1]){
    for(let h=0;h<=eh;h++){
      const w=Math.round((kid?2.2:3)*(1-h/(eh+1)))+(h<eh?0:0);
      const cx=s*((kid?2.5:3.2)+h*0.3), y=hy+(kid?3:3)+h;
      for(let x=Math.round(cx-w);x<=Math.round(cx+w);x++){
        box(head,x,x,y,y,-1,1,O);
        if(Math.abs(x-cx)<w-0.4 && h<eh-1) set(head,x,y,2,(s<0||kid)?C.fW:C.earIn);
      }
    }
    // blue shading in ear inner
    paint(head,(x,y,z,c)=> c===C.fW && z===2 && y>hy+3 && x*s<(kid?3:4) ? C.fB : null);
  }
  // tail: big fluffy, curling forward around the body, white tip
  const N=kid?11:12;
  for(let t=0;t<=N;t++){
    const a=t/N; const r=(kid?2.2:2.6)+Math.sin(a*Math.PI)*(kid?1.8:1.6)+(a>0.7?0.6:0);
    const x=(kid?3:4)+a*(kid?6:7)-a*a*(kid?2:3), z=-4+a*(kid?7:8), y=2+Math.sin(a*Math.PI)*2;
    ell(tail,x,y,z,r,r*0.8,r,a>0.84?C.fW:O);
  }
  paint(tail,(x,y,z,c)=> c===C.fW && y<=2 ? C.fB : null);

  const gb=mesh(body), gh=mesh(head,[0,hy-4,0]), gt=mesh(tail,[kid?3:4,2,-4]);
  root.add(gb,gh,gt);
  const inner=new THREE.Group(); inner.add(root); inner.scale.setScalar(kid?0.09:0.12);
  inner.userData={kind:kid?'kit':'chelsea',head:gh,tail:gt,body:gb};
  return inner;
}

// ---------- card (the physical card the character pops out of) ----------
function buildCard(circleColor,stripe){
  const g=new THREE.Group();
  const card=new THREE.Mesh(new THREE.BoxGeometry(2.4,0.04,3.4),new THREE.MeshLambertMaterial({color:'#f4f4f4'}));
  card.receiveShadow=true; g.add(card);
  const disc=new THREE.Mesh(new THREE.CylinderGeometry(0.9,0.9,0.045,40),new THREE.MeshLambertMaterial({color:circleColor}));
  disc.position.set(0,0.003,-0.25); disc.receiveShadow=true; g.add(disc);
  const bar=new THREE.Mesh(new THREE.BoxGeometry(2.3,0.045,0.35),new THREE.MeshLambertMaterial({color:stripe}));
  bar.position.set(0,0.003,1.45); g.add(bar);
  const top=new THREE.Mesh(new THREE.BoxGeometry(2.3,0.045,0.5),new THREE.MeshLambertMaterial({color:'#9c9c9c'}));
  top.position.set(0,0.003,-1.4); g.add(top);
  return g;
}

// ---------- scene ----------
const renderer=new THREE.WebGLRenderer({antialias:false});
renderer.shadowMap.enabled=true; renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene(); scene.background=new THREE.Color('#1d2230');
const cam=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,0.1,200); cam.position.set(4,3.2,6);
const ctl=new THREE.OrbitControls(cam,renderer.domElement); ctl.target.set(0,1,0); ctl.enableDamping=true;
scene.add(new THREE.HemisphereLight('#ffffff','#6a6f86',0.75));
const sun=new THREE.DirectionalLight('#ffffff',0.7); sun.position.set(5,10,6); sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024); Object.assign(sun.shadow.camera,{left:-8,right:8,top:8,bottom:-8}); scene.add(sun);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(40,40),new THREE.ShadowMaterial({opacity:0.25}));
floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; scene.add(floor);

const chars={
  mark:{obj:buildMark(),card:buildCard('#00ae67','#00ae67')},
  chelsea:{obj:buildFox(false),card:buildCard('#ffd954','#ffd954')},
  kit:{obj:buildFox(true),card:buildCard('#ffd954','#ffd954')}
};
for(const c of Object.values(chars)){ const g=new THREE.Group(); g.add(c.card,c.obj); c.group=g; scene.add(g); c.pop=1; }
chars.mark.obj.rotation.y=0;

let mode='mark';
function layout(){
  const L={mark:[[0,0,0]],chelsea:[[0,0,0]],kit:[[0,0,0]],all:null}[mode];
  for(const [n,c] of Object.entries(chars)){
    const withC=(mode==='chelsea'||mode==='all');
    c.group.visible = mode==='all' || mode===n || (n==='kit'&&withC);
    const base = mode==='all' ? {mark:[-2.4,0,0],chelsea:[1.6,0,0],kit:[1.6,0,0]}[n] : [0,0,0];
    if(n==='chelsea'&&withC){ base[0]-=0.45; }
    if(n==='kit'&&withC){ base[0]+=0.6; base[2]+=0.5; }
    c.group.position.set(...base);
    c.card.visible = !(n==='kit'&&withC);
  }
  chars.mark.obj.rotation.y = mode==='all'? Math.PI-0.4 : 0;
  cam.position.set(mode==='mark'?3:2.5, 3.2, mode==='all'?9:6.5);
}
function pop(){ for(const c of Object.values(chars)) c.pop=0; }
document.querySelectorAll('[data-show]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('[data-show]').forEach(x=>x.classList.remove('on')); b.classList.add('on');
  mode=b.dataset.show; layout(); pop();
});
document.getElementById('pop').onclick=pop;
let pix=true;
function applyPix(){ renderer.setPixelRatio(pix?0.45:Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight); renderer.domElement.classList.toggle('pix',pix); document.getElementById('pix').classList.toggle('on',pix); }
document.getElementById('pix').onclick=()=>{pix=!pix;applyPix();};
document.getElementById('spin').onclick=e=>{ctl.autoRotate=!ctl.autoRotate; e.target.classList.toggle('on',ctl.autoRotate);};
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();applyPix();});
applyPix(); layout(); pop();

// ---------- idle animation ----------
const ease=t=>{const c=1.7;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);}; // back-out bounce
const clock=new THREE.Clock();
function tick(){
  const dt=clock.getDelta(), t=clock.elapsedTime;
  for(const [n,c] of Object.entries(chars)){
    const u=c.obj.userData; c.pop=Math.min(1,c.pop+dt*1.4);
    const s=ease(c.pop); const base=c.obj.scale.x/(c.obj.userData._s||1);
    c.obj.userData._s=c.obj.userData._s||1;
    c.obj.children[0].scale.setScalar(Math.max(0.001,s));
    c.obj.position.y=(1-c.pop)*-0.3;
    const sp=n==='kit'?1.8:1;
    if(u.kind==='mark'){
      u.body.position.y=Math.sin(t*2)*0.15;
      u.head.rotation.z=Math.sin(t*1.3)*0.06; u.head.rotation.y=Math.sin(t*0.7)*0.18; // sniffing around
      u.head.position.y=10+Math.sin(t*2)*0.15;
      u.tail.rotation.y=Math.sin(t*2.4)*0.25;
      u.halo.position.y=23+Math.sin(t*2.2)*0.6; u.halo.rotation.y=t*0.8;
    } else {
      u.body.scale.y=1+Math.sin(t*2.2*sp)*0.015;
      u.head.rotation.z=Math.sin(t*1.1*sp)*0.09; u.head.rotation.x=Math.sin(t*0.8*sp)*0.05;
      u.tail.rotation.y=Math.sin(t*3*sp)*0.22;
    }
  }
  ctl.update(); renderer.render(scene,cam); requestAnimationFrame(tick);
}
tick();
</script>
</body>
</html>
