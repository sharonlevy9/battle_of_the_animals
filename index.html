<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>AR Card Fighters</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{--bg:#171b27;--ink:#f4f1ea;--mut:#9aa3b8;--acc:#ff7a2f;--ok:#2fd28a;--bad:#ff4a5a;--panel:#232a3b;--line:#3b4560;color-scheme:dark}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;touch-action:none}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
#msg{position:fixed;top:0;left:0;right:0;padding:12px max(16px,env(safe-area-inset-right)) 8px max(16px,env(safe-area-inset-left));text-align:center;font-weight:700;font-size:16px;line-height:1.3;pointer-events:none;text-shadow:0 2px 6px #000a}
#msg small{display:block;font-weight:500;color:var(--mut);font-size:13px;margin-top:2px}
#bar{position:fixed;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:10px max(16px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left));background:linear-gradient(transparent,#0009 40%)}
button{font:inherit;font-weight:700;min-height:44px;padding:8px 14px;color:var(--ink);background:var(--panel);border:2px solid var(--line);border-radius:10px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--acc)}
button:disabled{opacity:.4;cursor:default}
button.main{background:var(--acc);border-color:var(--acc);color:#1b1208}
button.sel{border-color:var(--acc);background:#3a2a22}
button span{display:block;font-weight:500;font-size:11px;color:var(--mut)}
#tags{position:fixed;inset:0;pointer-events:none}
.tag{position:absolute;transform:translate(-50%,-50%);background:#0b0e16cc;border:2px solid var(--line);border-radius:10px;padding:6px 10px;text-align:center;min-width:92px;font-size:13px;display:none}
.tag.on{display:block}
.tag.turn{border-color:var(--acc);box-shadow:0 0 14px #ff7a2f88}
.tag b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.h{font-size:24px;line-height:1;background:linear-gradient(90deg,#ff4a5a var(--f),#4a4f60 var(--f));-webkit-background-clip:text;background-clip:text;color:transparent}
.pw{display:flex;gap:4px;justify-content:center;margin-top:4px}
.pw i{width:20px;height:7px;border-radius:2px;background:#3a4257}
.pw i.f{background:#ffd23f;box-shadow:0 0 6px #ffd23f}
.gd{color:#7fd6ff;font-weight:700;font-size:11px;margin-top:2px}
.pop{position:fixed;transform:translate(-50%,-50%);font-weight:800;font-size:26px;pointer-events:none;text-shadow:0 2px 0 #000,0 0 10px #000;animation:pop 1.1s ease-out forwards}
@keyframes pop{0%{opacity:0;margin-top:0;scale:.5}15%{opacity:1;scale:1.2}100%{opacity:0;margin-top:-70px;scale:1}}
#fight{position:fixed;left:0;right:0;top:36%;text-align:center;font-size:min(22vw,150px);font-weight:900;font-style:italic;letter-spacing:.04em;color:#fff;-webkit-text-stroke:3px #b3260f;text-shadow:0 8px 0 #b3260f,0 0 40px #ff7a2f;opacity:0;pointer-events:none}
#fight.go{animation:fight 1.6s ease-out forwards}
@keyframes fight{0%{opacity:0;transform:scale(2.6) skewX(-10deg)}20%{opacity:1;transform:scale(1) skewX(-10deg)}70%{opacity:1;transform:scale(1.05) skewX(-10deg)}100%{opacity:0;transform:scale(1.4) skewX(-10deg)}}
@media (prefers-reduced-motion:reduce){.pop,#fight.go{animation-duration:.01s}}

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// ---------- palette sampled from the cards ----------
const C = {
  // Mark
  mO:'#f76826', mOD:'#c94f17', mDark:'#ad4510', cream:'#feeba9', creamD:'#f2d98a',
  teal:'#32aba6', tealL:'#5fd0c6', black:'#0d0d12', white:'#ffffff', haloY:'#fdff03', haloRim:'#fffbd6',
  // Chelsea
  fO:'#f58845', fOD:'#e06a2c', kO:'#ff8643', fW:'#ffffff', fB:'#b8dcea', fBD:'#7fb3cf',
  brown:'#975640', dk:'#22142a', earIn:'#6b586c'
};

// ---------- tiny voxel toolkit ----------
function Part(){ return new Map(); }
const k=(x,y,z)=>x+','+y+','+z;
function set(p,x,y,z,c){ p.set(k(Math.round(x),Math.round(y),Math.round(z)),c); }
function box(p,x0,x1,y0,y1,z0,z1,c){ for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++)for(let z=z0;z<=z1;z++)set(p,x,y,z,c); }
function ell(p,cx,cy,cz,rx,ry,rz,c){
  for(let x=Math.floor(cx-rx);x<=Math.ceil(cx+rx);x++)for(let y=Math.floor(cy-ry);y<=Math.ceil(cy+ry);y++)for(let z=Math.floor(cz-rz);z<=Math.ceil(cz+rz);z++){
    const d=((x-cx)/rx)**2+((y-cy)/ry)**2+((z-cz)/rz)**2; if(d<=1)set(p,x,y,z,c);}
}
function paint(p,fn){ for(const [key,c] of p){ const [x,y,z]=key.split(',').map(Number); const n=fn(x,y,z,c); if(n)p.set(key,n);} }
// paint front-most voxel of column (x,y) (facing +z)
function front(p,x,y,c,depth=1){ let mz=-1e9; for(const key of p.keys()){const [a,b,z]=key.split(',').map(Number); if(a===x&&b===y&&z>mz)mz=z;} if(mz>-1e9){for(let d=0;d<depth;d++)if(p.has(k(x,y,mz-d)))p.set(k(x,y,mz-d),c);} return mz; }
// paint side-most voxel of column (x,y) on side s (+1 => +z, -1 => -z)
function side(p,x,y,s,c){ let best=null; for(const key of p.keys()){const [a,b,z]=key.split(',').map(Number); if(a===x&&b===y&&(best===null||z*s>best*s))best=z;} if(best!==null)p.set(k(x,y,best),c); return best; }

const geo=new THREE.BoxGeometry(1,1,1);

// ---------- MARK the crocodile (head toward -x) ----------
function buildMark(){
  const root=new THREE.Group();
  const body=Part(), head=Part(), tail=Part(), halo=Part();
  // body + belly
  ell(body,10,8,0,9,4.5,5,C.mO);
  paint(body,(x,y)=> y<=6 && x<16 ? C.cream : null);
  paint(body,(x,y,z)=> y<=5 && x<16 && Math.abs(z)>=4 ? C.creamD : null);
  // legs: chunky, with toes pointing forward
  for(const [lx,s] of [[3,1],[3,-1],[14,1],[14,-1]]){
    const z0=s>0?3:-6, z1=s>0?6:-3;
    box(body,lx,lx+3,1,5,z0,z1,s>0?C.mO:C.mOD);
    box(body,lx-2,lx+3,0,0,z0,z1,s>0?C.mO:C.mOD);
    for(const tz of [z0,z0+2,z1]) set(body,lx-3,0,tz,s>0?C.mO:C.mOD); // toes
    box(body,lx+1,lx+3,5,6,z0,z1,C.mDark); // shoulder crease
  }
  // back spikes (teal, two-tone)
  for(const sx of [9,13,17]){
    for(let h=0;h<4;h++){ const w=3-h; box(body,sx-w+1,sx+w-1,12+h,12+h,-1,1,h>=2?C.tealL:C.teal); }
  }
  // head
  ell(head,2,13,0,6,5,5,C.mO);
  paint(head,(x,y)=> y<=10 ? C.cream : null);
  // raised eye bumps on top of head
  for(const s of [1,-1]) ell(head,4,16.5,s*2.5,2.6,2.4,2.2,C.mO);
  // upper snout
  box(head,-14,-3,11,13,-3,3,C.mO);
  box(head,-11,-3,14,14,-2,2,C.mO);
  box(head,-16,-14,12,14,-3,3,C.mO);       // up-turned tip
  for(const s of [2,-2]) box(head,-16,-15,15,15,s,s,C.mO); // nostril bumps
  box(head,-16,-15,15,15,0,0,C.mDark);
  // lower jaw (cream, wide)
  box(head,-14,-1,8,10,-3,3,C.cream);
  ell(head,-1,9,0,5,3,4.6,C.cream);
  box(head,-14,-4,7,7,-2,2,C.creamD);
  // smile / lip line
  for(let x=-14;x<=1;x++) for(const s of [3,-3]) set(head,x,11,s,C.mDark);
  for(const s of [1,-1]){ set(head,2,12,s*4,C.mDark); set(head,3,13,s*5,C.mDark); }
  // tooth (white, hanging down)
  for(const s of [1,-1]){ box(head,-6,-5,9,10,s*4,s*4,C.white); }
  // eyes: big black, white glint, heavy brow
  for(const s of [1,-1]){
    const z=s*4;
    box(head,3,5,16,17,z,z,C.black); set(head,5,18,z,C.black);
    set(head,4,17,z+s,C.black); set(head,3,16,z+s,C.black); set(head,5,17,z+s,C.white);
    for(let x=2;x<=6;x++) set(head,x,19,s*3,C.mDark);
    box(head,2,6,19,19,-2,2,C.mO);
  }
  // tail (wags) — tapers and curls up at the tip like the card
  for(let t=0;t<=13;t++){
    const r=Math.max(0.9,3.6*(1-t/15)); const cy=7+(t>6?(t-6)*0.55:0)+(t>11?(t-11)*0.6:0);
    ell(tail,19+t,cy,0,0.8,r,r,C.mO);
  }
  paint(tail,(x,y)=> y<=5 && x<26 ? C.cream : null);
  for(const tx of [22,26]){ box(tail,tx-1,tx+1,11,11,0,0,C.teal); set(tail,tx,12,0,C.tealL); }
  // halo: flat ring, yellow with pale rim
  for(let x=-7;x<=7;x++)for(let z=-7;z<=7;z++){const d=Math.hypot(x,z*1.15); if(d>=3.2&&d<5.7)set(halo,x,0,z,C.haloY); else if(d>=5.7&&d<6.3)set(halo,x,0,z,C.haloRim);}

  const gb=mesh(body), gh=mesh(head,[6,10,0]), gt=mesh(tail,[19,7,0]), ga=mesh(halo);
  ga.position.set(2,23,0);
  root.add(gb,gh,gt,ga);
  root.userData={kind:'mark',head:gh,tail:gt,halo:ga,body:gb};
  // center & scale
  const inner=new THREE.Group(); inner.add(root); root.position.set(-6,0,0); inner.scale.setScalar(0.12);
  inner.userData=root.userData; return inner;
}

// ---------- CHELSEA (big) and the little fox (facing +z) ----------
function buildFox(kid){
  const O=kid?C.kO:C.fO;
  const root=new THREE.Group();
  const body=Part(), head=Part(), tail=Part();
  const bodyR=kid?[4,5.5,4]:[5,7,5], bodyY=kid?5.5:7;
  // sitting body + haunches
  ell(body,0,bodyY,-1,...bodyR,O);
  for(const s of [1,-1]) ell(body,s*(kid?3:4),kid?3:4,-1,kid?2.5:3,kid?3:4,kid?3.5:4.5,O);
  // white fluffy chest with blue shading on the shadow side
  ell(body,0,bodyY+(kid?2:3),kid?2:2.5,kid?3:4,kid?3.5:4.5,kid?2.2:3,C.fW);
  for(const s of [1,-1]) set(body,s*(kid?3:4),bodyY+(kid?4:6),kid?3:4,C.fW);
  paint(body,(x,y,z,c)=> c===C.fW && x<=-1 && y<bodyY+1 ? C.fB : null);
  paint(body,(x,y,z,c)=> c===C.fW && x<=-2 && y<bodyY-1 ? C.fBD : null);
  // front legs (brown socks, dark paws)
  const legTop=kid?5:7, legZ=kid?2:3;
  for(const s of [1,-1]){
    const x0=s>0?1:-(kid?2:3), x1=s>0?(kid?2:3):-1;
    box(body,x0,x1,0,legTop,legZ,legZ+1,O);
    paint(body,(x,y,z)=> x>=x0&&x<=x1&&z>=legZ&&z<=legZ+1&&y<=legTop-2 ? C.brown : null);
    box(body,x0,x1,0,0,legZ,legZ+2,C.dk);
    // back feet
    box(body,s*(kid?3:5)-1,s*(kid?3:5)+1,0,0,0,legZ,C.brown);
  }
  // head
  const hy=kid?13:17, hr=kid?[5,4.3,4.5]:[6,5,5];
  ell(head,0,hy,1,...hr,O);
  // white cheeks/lower face + spiky cheek fluff
  paint(head,(x,y,z)=> y<=hy-2 && z>=1 && Math.abs(x)>=1 ? C.fW : null);
  for(const s of [1,-1]){
    ell(head,s*(hr[0]-0.5),hy-2,1,2.5,2.2,2.6,C.fW);
    set(head,s*(hr[0]+2),hy-2,1,C.fW); set(head,s*(hr[0]+2),hy-3,0,C.fW); set(head,s*(hr[0]+1),hy-4,1,C.fW);
  }
  paint(head,(x,y,z,c)=> c===C.fW && x<0 && y<hy-2 ? C.fB : null);
  // muzzle, nose, smile
  box(head,-1,1,hy-3,hy-2,hr[2],hr[2]+1,C.fW);
  set(head,0,hy-2,hr[2]+2,C.dk);
  set(head,0,hy-4,hr[2],C.dk);
  // closed happy eyes ( ^ ^ )
  for(const s of [1,-1]){
    const pts=kid?[[1,0],[2,1],[3,0]]:[[1,0],[2,1],[3,1],[4,0]];
    for(const [dx,dy] of pts) front(head,s*dx,hy+dy,C.dk);
  }
  // blush-free forehead stripe of darker orange
  paint(head,(x,y,z,c)=> c===O && y>=hy+3 && z<=-2 ? C.fOD : null);
  // ears: tall, tilted out, orange outside, pale inner with blue
  const eh=kid?5:6;
  for(const s of [1,-1]){
    for(let h=0;h<=eh;h++){
      const w=Math.round((kid?2.2:3)*(1-h/(eh+1)))+(h<eh?0:0);
      const cx=s*((kid?2.5:3.2)+h*0.3), y=hy+(kid?3:3)+h;
      for(let x=Math.round(cx-w);x<=Math.round(cx+w);x++){
        box(head,x,x,y,y,-1,1,O);
        if(Math.abs(x-cx)<w-0.4 && h<eh-1) set(head,x,y,2,(s<0||kid)?C.fW:C.earIn);
      }
    }
    // blue shading in ear inner
    paint(head,(x,y,z,c)=> c===C.fW && z===2 && y>hy+3 && x*s<(kid?3:4) ? C.fB : null);
  }
  // tail: big fluffy, curling forward around the body, white tip
  const N=kid?11:12;
  for(let t=0;t<=N;t++){
    const a=t/N; const r=(kid?2.2:2.6)+Math.sin(a*Math.PI)*(kid?1.8:1.6)+(a>0.7?0.6:0);
    const x=(kid?3:4)+a*(kid?6:7)-a*a*(kid?2:3), z=-4+a*(kid?7:8), y=2+Math.sin(a*Math.PI)*2;
    ell(tail,x,y,z,r,r*0.8,r,a>0.84?C.fW:O);
  }
  paint(tail,(x,y,z,c)=> c===C.fW && y<=2 ? C.fB : null);

  const gb=mesh(body), gh=mesh(head,[0,hy-4,0]), gt=mesh(tail,[kid?3:4,2,-4]);
  root.add(gb,gh,gt);
  const inner=new THREE.Group(); inner.add(root); inner.scale.setScalar(kid?0.09:0.12);
  inner.userData={kind:kid?'kit':'chelsea',head:gh,tail:gt,body:gb};
  return inner;
}

const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function anim(ms,fn){return new Promise(res=>{const t0=performance.now();const step=()=>{const t=Math.min(1,(performance.now()-t0)/ms);fn(t);t<1?requestAnimationFrame(step):res();};requestAnimationFrame(step);});}
const easeOutBack=t=>{const c=1.70158;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function angDiff(a,b){let d=(b-a)%(Math.PI*2);if(d>Math.PI)d-=Math.PI*2;if(d<-Math.PI)d+=Math.PI*2;return d;}

// instanced voxel mesh that can dissolve per voxel
function mesh(p,pivot=[0,0,0]){
  const m=new THREE.InstancedMesh(geo,new THREE.MeshLambertMaterial(),p.size);const o=new THREE.Object3D();const col=new THREE.Color();let i=0;const base=[],rnd=[];
  for(const [key,c] of p){const [x,y,z]=key.split(',').map(Number);base.push([x-pivot[0],y-pivot[1],z-pivot[2]]);rnd.push(Math.random()*0.6+clamp(1-y/24,0,1)*0.4);
    o.position.set(x-pivot[0],y-pivot[1],z-pivot[2]);o.updateMatrix();m.setMatrixAt(i,o.matrix);m.setColorAt(i,col.set(c));i++;}
  m.castShadow=true;m.receiveShadow=true;m.frustumCulled=false;m.userData={base,rnd};
  const g=new THREE.Group();g.add(m);g.position.set(...pivot);return g;
}
function dissolve(root,t,rise){root.traverse(m=>{if(!m.isInstancedMesh)return;const {base,rnd}=m.userData;const o=new THREE.Object3D();
  for(let i=0;i<base.length;i++){const s=clamp((t-rnd[i]*0.7)/0.3,0,1);o.position.set(base[i][0],base[i][1]+s*rise,base[i][2]);o.scale.setScalar(Math.max(1-s,0.0001));o.updateMatrix();m.setMatrixAt(i,o.matrix);}
  m.instanceMatrix.needsUpdate=true;});}

const renderer=new THREE.WebGLRenderer({antialias:false});
renderer.shadowMap.enabled=true;$('#stage').appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#171b27');
const cam=new THREE.PerspectiveCamera(42,1,0.1,100);
const ctl=new THREE.OrbitControls(cam,renderer.domElement);ctl.target.set(0,0.8,2);ctl.enableDamping=true;ctl.enablePan=false;ctl.minDistance=7;ctl.maxDistance=30;ctl.maxPolarAngle=1.45;
scene.add(new THREE.HemisphereLight('#ffffff','#6a6f86',0.8));
const sun=new THREE.DirectionalLight('#ffffff',0.7);sun.position.set(5,10,6);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-10,right:10,top:10,bottom:10});scene.add(sun);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(40,40),new THREE.MeshLambertMaterial({color:'#2a3142'}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const grid=new THREE.GridHelper(40,40,'#3b4560','#303850');grid.position.y=0.01;scene.add(grid);
const fxGroup=new THREE.Group();scene.add(fxGroup);
function fit(){const a=innerWidth/innerHeight;renderer.setPixelRatio(Math.min(devicePixelRatio||1,2)*0.5);renderer.setSize(innerWidth,innerHeight,false);cam.aspect=a;cam.updateProjectionMatrix();
  const d=15*clamp(1.15/a,1,2.3);cam.position.set(0,ctl.target.y+d*0.55,ctl.target.z+d*0.83);}
addEventListener('resize',fit);fit();

// ---------- cards ----------
const CARDS={mark:{x:-3.6,z:5.0,disc:'#00ae67',name:'Mark'},chel:{x:3.2,z:5.0,disc:'#ffd954',name:'Chelsea'}};
for(const k in CARDS){const c=CARDS[k];c.cv=document.createElement('canvas');c.cv.width=414;c.cv.height=735;c.ctx=c.cv.getContext('2d');
  c.tex=new THREE.CanvasTexture(c.cv);c.img=new Image();c.img.onload=()=>drawCard(k,c.empty);c.img.src=IMG[k];
  c.mesh=new THREE.Mesh(new THREE.PlaneGeometry(2.2,3.9),new THREE.MeshBasicMaterial({map:c.tex}));c.mesh.rotation.x=-Math.PI/2;c.mesh.position.set(c.x,0.03,c.z);c.mesh.userData.card=k;scene.add(c.mesh);}
function drawCard(k,empty){const c=CARDS[k];c.empty=empty;const x=c.ctx;x.fillStyle='#fff';x.fillRect(0,0,414,735);if(c.img.complete)x.drawImage(c.img,0,0,414,735);
  if(empty){x.fillStyle='#fff';x.fillRect(0,100,414,395);x.fillStyle=c.disc;x.beginPath();x.arc(207,300,150,0,7);x.fill();}c.tex.needsUpdate=true;}
async function cardFlash(k){const m=CARDS[k].mesh;await anim(500,t=>{m.position.y=0.03+Math.sin(t*Math.PI)*0.6;m.rotation.z=Math.sin(t*Math.PI*2)*0.12;});m.position.y=0.03;m.rotation.z=0;}

// ---------- units ----------
function makeUnit(kind){
  const obj=kind==='mark'?buildMark():buildFox(kind==='small');const holder=new THREE.Group();holder.add(obj);holder.visible=false;holder.scale.setScalar(0.001);scene.add(holder);
  const homes={mark:[-3.5,0.2],big:[2.6,-0.5],small:[4.3,1.0]};
  return {kind,obj,holder,type:kind==='mark'?'croc':'fox',small:kind==='small',scale:kind==='small'?0.8:0.75,home:homes[kind],phase:Math.random()*6,sunk:false,mouth:kind==='mark'?1.0:(kind==='small'?1.1:1.5)};
}
function headingFor(u,dx,dz){return u.type==='croc'?Math.atan2(dz,-dx):Math.atan2(dx,dz);}
async function turnTo(u,dx,dz,ms=300){const r0=u.holder.rotation.y,tg=headingFor(u,dx,dz);await anim(ms,t=>{u.holder.rotation.y=r0+angDiff(r0,tg)*t;});}
async function walkTo(u,x,z,ms){const p=u.holder.position;const x0=p.x,z0=p.z,dx=x-x0,dz=z-z0;
  if(Math.hypot(dx,dz)>0.05){const tg=headingFor(u,dx,dz),r0=u.holder.rotation.y;await anim(ms,t=>{u.holder.rotation.y=r0+angDiff(r0,tg)*Math.min(1,t*4);p.x=x0+dx*t;p.z=z0+dz*t;p.y=u.sunk?p.y:Math.abs(Math.sin(t*ms/130))*0.14;});}
  if(!u.sunk)p.y=0;}
async function popOut(u,cx,cz){u.holder.visible=true;u.holder.position.set(cx,0.05,cz);u.holder.rotation.y=headingFor(u,0,-1);
  await anim(800,t=>{u.holder.scale.setScalar(Math.max(0.001,easeOutBack(t)*u.scale));u.holder.position.y=Math.sin(t*Math.PI)*1.2;});u.holder.position.y=0;}
function idle(u,t){const d=u.obj.userData;t+=u.phase;const sp=u.small?1.8:1;
  if(d.kind==='mark'){d.body.position.y=Math.sin(t*2)*0.15;d.head.rotation.z=Math.sin(t*1.3)*0.06;d.head.rotation.y=Math.sin(t*0.7)*0.18;d.head.position.y=10+Math.sin(t*2)*0.15;d.tail.rotation.y=Math.sin(t*2.4)*0.25;d.halo.position.y=23+Math.sin(t*2.2)*0.6;d.halo.rotation.y=t*0.8;}
  else{d.body.scale.y=1+Math.sin(t*2.2*sp)*0.015;d.head.rotation.z=Math.sin(t*1.1*sp)*0.09;d.head.rotation.x=Math.sin(t*0.8*sp)*0.05;d.tail.rotation.y=Math.sin(t*3*sp)*0.22;}}

// ---------- state ----------
let S,order,state,turn,busy,selUnit,obstacle;
const OTHER={mark:'chel',chel:'mark'};
function reset(){
  if(S)for(const k in S)S[k].units.forEach(u=>scene.remove(u.holder));
  if(obstacle){scene.remove(obstacle.m);}
  S={mark:{scanned:false,hp:6,pow:0,guard:false,units:[]},chel:{scanned:false,hp:6,pow:0,guard:false,units:[]}};
  order=[];state='scan';turn=null;busy=false;selUnit=0;obstacle=null;ctl.enabled=true;
  drawCard('mark',false);drawCard('chel',false);refreshTags();scanUI();
}
function setMsg(a,b){$('#msg').innerHTML=a+(b?'<small>'+b+'</small>':'');}
function btn(label,fn,o={}){const b=document.createElement('button');b.innerHTML=label+(o.sub?'<span>'+o.sub+'</span>':'');if(o.cls)b.className=o.cls;if(o.dis)b.disabled=true;b.onclick=fn;$('#bar').appendChild(b);return b;}
function clearBar(){$('#bar').innerHTML='';}

// ---------- HUD tags ----------
const tagEls={};for(const k in CARDS){const d=document.createElement('div');d.className='tag';$('#tags').appendChild(d);tagEls[k]=d;}
function hearts(hp){let s='';for(let i=0;i<3;i++){const f=hp>=2*i+2?'100%':hp===2*i+1?'50%':'0%';s+='<span class="h" style="--f:'+f+'">♥</span>';}return s;}
function refreshTags(){for(const k in CARDS){const f=S[k],d=tagEls[k];if(!f.scanned){d.className='tag on';d.innerHTML='<b>'+CARDS[k].name+'</b>'+(state==='scan'?'tap to scan':'');d.style.opacity=state==='scan'?'.9':'0';continue;}
  d.style.opacity='1';d.className='tag on'+(turn===k&&state==='fight'?' turn':'');
  d.innerHTML='<b>'+CARDS[k].name+'</b>'+hearts(f.hp)+'<div class="pw">'+[0,1,2].map(i=>'<i class="'+(f.pow>i?'f':'')+'"></i>').join('')+'</div>'+(f.guard?'<div class="gd">DODGING</div>':'');}}
const _v=new THREE.Vector3();
function toScreen(x,y,z){_v.set(x,y,z).project(cam);return [(_v.x*.5+.5)*innerWidth,(-_v.y*.5+.5)*innerHeight];}
function popText(wp,text,color='#fff'){const [x,y]=toScreen(wp.x,wp.y+1.5,wp.z);const d=document.createElement('div');d.className='pop';d.textContent=text;d.style.cssText+=`left:${x}px;top:${y}px;color:${color}`;document.body.appendChild(d);setTimeout(()=>d.remove(),1200);}
const centerOf=f=>f.units[0].holder.position;

// ---------- scan scenario (steps 1-2) ----------
function scanUI(){clearBar();setMsg('Step 1 · Scan a card','Tap a card on the table, or use the buttons');
  btn('Scan Mark’s card',()=>scan('mark'),{cls:'main'});btn('Scan Chelsea’s card',()=>scan('chel'),{cls:'main'});}
async function scan(k){
  if(busy||S[k].scanned||state!=='scan')return;busy=true;clearBar();S[k].scanned=true;order.push(k);const f=S[k],c=CARDS[k];
  setMsg('Scanning '+c.name+'…');tagEls[k].innerHTML='<b>'+c.name+'</b>scanning…';await sleep(650);
  drawCard(k,true);cardFlash(k);
  f.units=k==='mark'?[makeUnit('mark')]:[makeUnit('big'),makeUnit('small')];
  await Promise.all(f.units.map((u,i)=>popOut(u,c.x+(i?0.8:(k==='chel'?-0.4:0)),c.z+(i?0.5:0))));
  refreshTags();
  if(order.length===1){
    setMsg(c.name+' looks and sniffs around…');
    await Promise.all(f.units.map(u=>walkTo(u,u.home[0]+(u.kind==='mark'?0.2:0),2.4+(u.small?0.9:0),1500)));
    const r0=f.units.map(u=>u.holder.rotation.y);
    await anim(2600,t=>f.units.forEach((u,i)=>{u.holder.rotation.y=r0[i]+Math.sin(t*Math.PI*3)*0.8*(1-t*0.3);}));
    setMsg('Step 2 · Scan the second card','The new character will scare the first one');
    state='scan';busy=false;scanUI2();
  }else{
    state='scare';await scare();
  }
}
function scanUI2(){clearBar();const k=OTHER[order[0]];btn('Scan '+CARDS[k].name+'’s card',()=>scan(k),{cls:'main'});}
async function scare(){
  const A=S[order[0]],B=S[order[1]],c=CARDS[order[1]];
  const ax=A.units[0].holder.position.x;const tx=ax+(c.x>ax?3.4:-3.4);
  setMsg(c.name+' charges in!');
  await Promise.all(B.units.map((u,i)=>walkTo(u,tx+(i?(c.x>ax?0.7:-0.7):0),2.4+(i?0.9:0),900)));
  await Promise.all([...B.units.map(u=>turnTo(u,ax-tx,0,250)),...A.units.map(u=>turnTo(u,tx-ax,0,250))]);
  popText(A.units[0].holder.position,'!','#ffd23f');
  const bp=B.units.map(u=>u.holder.position.clone()),ap=A.units.map(u=>u.holder.position.clone()),away=Math.sign(ax-tx);
  await anim(900,t=>{
    B.units.forEach((u,i)=>{u.holder.position.x=bp[i].x+Math.sin(t*60)*0.05;u.holder.scale.setScalar(u.scale*(1+Math.sin(t*Math.PI)*0.16));});
    A.units.forEach((u,i)=>{const e=Math.min(1,t*3);u.holder.position.set(ap[i].x+away*0.9*e+Math.sin(t*50)*0.06*(1-t),Math.sin(Math.min(1,t*2.5)*Math.PI)*1.3,ap[i].z);});});
  A.units.forEach(u=>u.holder.position.y=0);
  setMsg('Both take battle positions…');
  await Promise.all([...A.units,...B.units].map(async u=>{await walkTo(u,u.home[0],u.home[1],1300);await turnTo(u,u.type==='croc'?1:-1,u.type==='croc'?0:0.7,350);}));
  state='arm';busy=false;ctl.enabled=false;refreshTags();
  setMsg('Step 3 · Raise your arm between the characters','Swipe up on the screen, or press the button');
  clearBar();btn('✋ Raise arm',raiseArm,{cls:'main'});
}

// ---------- arm + FIGHT (step 3) ----------
function buildArm(){const p=Part(),skin='#e9b08b',sl='#2a6ea0';box(p,-2,2,0,6,-1,1,sl);box(p,-2,2,7,12,-1,1,skin);box(p,-3,3,13,16,-1,1,skin);
  for(const x of [-3,-1,1,3])box(p,x,x,17,20,-1,1,skin);box(p,-5,-4,13,16,-1,1,skin);const g=mesh(p);g.scale.setScalar(0.14);return g;}
async function raiseArm(){
  if(state!=='arm'||busy)return;busy=true;state='armUp';clearBar();setMsg('');
  const arm=buildArm();const w=new THREE.Group();w.add(arm);w.position.set(0,-3.4,2.2);scene.add(w);
  await anim(700,t=>{w.position.y=-3.4+3.4*(1-Math.pow(1-t,3));});
  await anim(350,t=>{w.rotation.z=-0.5*Math.sin(t*Math.PI*2)*0.9;});
  const f=$('#fight');f.classList.remove('go');void f.offsetWidth;f.classList.add('go');
  await anim(500,t=>{w.rotation.z=Math.sin(t*Math.PI*3)*0.4;});
  await anim(500,t=>{w.position.y=-t*3.6;});scene.remove(w);
  await sleep(500);startFight();
}

// ---------- fight (steps 4-5) ----------
function startFight(){state='fight';turn=order[0];busy=false;ctl.enabled=true;beginTurn(true);}
async function beginTurn(first){
  const f=S[turn];if(!first)f.pow=Math.min(3,f.pow+1);
  if(f.guard){f.guard=false;for(const u of f.units)if(u.sunk){u.sunk=false;await anim(350,t=>{u.holder.position.y=-1.15*(1-t);});}}
  selUnit=0;refreshTags();turnUI();
}
function moveDefs(k,unit){
  if(k==='mark')return[{id:'normal',label:'Bite',cost:0,dmg:1,fx:'bite'},{id:'special',label:'Tail hit',cost:3,dmg:2,fx:'tail'},{id:'duck',label:'Dive',cost:0},{id:'heal',label:'Heal',cost:2}];
  if(unit===0)return[{id:'normal',label:'Sound waves',cost:0,dmg:1,fx:'wave'},{id:'special',label:'Fire blow',cost:3,dmg:2,fx:'fire'},{id:'duck',label:'Run & jump',cost:0}];
  return[{id:'normal',label:'Small waves',cost:0,dmg:1,fx:'wave'},{id:'special',label:'Sparks',cost:1,dmg:1,fx:'sparks'},{id:'duck',label:'Quick dodge',cost:0}];
}
function turnUI(){
  clearBar();const k=turn,f=S[k];const pn=order.indexOf(k)+1;
  setMsg('Player '+pn+' · '+CARDS[k].name+'’s turn',obstacle?'Object on the table: attacks may miss':'Tap the table to drop an object between them');
  if(k==='chel'){btn('Big Chelsea',()=>{selUnit=0;turnUI();},{cls:selUnit===0?'sel':''});btn('Little fox',()=>{selUnit=1;turnUI();},{cls:selUnit===1?'sel':''});}
  for(const mv of moveDefs(k,selUnit))btn(mv.label,()=>act(mv),{dis:f.pow<mv.cost,sub:mv.id==='duck'?'dodge next hit +power':mv.id==='heal'?'+1 heart · needs 2':mv.cost?'needs '+mv.cost+' power':(mv.dmg?'½ heart':'')});
  btn('Drop object',()=>placeObstacle(lerp(-1,1,Math.random()),0.3));
}
function removeObstacle(){if(!obstacle)return;const o=obstacle;obstacle=null;anim(300,t=>o.m.scale.setScalar(1-t)).then(()=>scene.remove(o.m));}
function placeObstacle(x,z){
  if(state!=='fight'||busy)return;removeObstacle();x=clamp(x,-1.6,1.6);z=clamp(z,-1.2,2);
  const m=new THREE.Mesh(new THREE.BoxGeometry(0.9,0.9,0.9),new THREE.MeshLambertMaterial({color:['#7b8cff','#ffb84d','#6fd6a8'][Math.floor(Math.random()*3)]}));m.castShadow=true;scene.add(m);obstacle={m,turns:2,x,z};
  anim(500,t=>{m.position.set(x,0.45+(1-t)*4*Math.abs(Math.cos(t*Math.PI*1.5)),z);});popText(new THREE.Vector3(x,0,z),'Object!','#ffd23f');if(state==='fight')turnUI();
}
const boxGeo=new THREE.BoxGeometry(1,1,1);
async function particles(from,to,{n,size,cols,spread,dur,grav=0,grow=0}){
  const ps=[];for(let i=0;i<n;i++){const m=new THREE.Mesh(boxGeo,new THREE.MeshBasicMaterial({color:cols[i%cols.length],transparent:true}));m.scale.setScalar(size);fxGroup.add(m);ps.push({m,d:Math.random()*0.35,j:[(Math.random()-.5)*spread,(Math.random()-.5)*spread,(Math.random()-.5)*spread]});}
  await anim(dur,t=>{for(const q of ps){const tt=clamp((t-q.d)/(1-q.d),0,1);q.m.visible=tt>0&&tt<1;q.m.position.set(lerp(from.x,to.x,tt)+q.j[0]*tt,lerp(from.y,to.y,tt)+q.j[1]*tt-grav*tt*tt,lerp(from.z,to.z,tt)+q.j[2]*tt);q.m.scale.setScalar(size*(1+grow*tt));q.m.material.opacity=1-tt*0.3;}});
  for(const q of ps){fxGroup.remove(q.m);q.m.material.dispose();}
}
async function rings(from,to,{n,size,color,dur}){
  const g=new THREE.TorusGeometry(0.45,0.07,6,18),ms=[];for(let i=0;i<n;i++){const m=new THREE.Mesh(g,new THREE.MeshBasicMaterial({color,transparent:true}));m.rotation.y=Math.PI/2;fxGroup.add(m);ms.push(m);}
  await anim(dur,t=>{ms.forEach((m,i)=>{const tt=clamp((t-i*0.18)/(1-i*0.18),0,1);m.visible=tt>0&&tt<1;m.position.set(lerp(from.x,to.x,tt),lerp(from.y,to.y,tt),lerp(from.z,to.z,tt));m.scale.setScalar(size*(0.5+tt*1.3));m.material.opacity=1-tt*0.6;});});
  ms.forEach(m=>{fxGroup.remove(m);m.material.dispose();});
}
async function shake(units){const base=units.map(u=>u.holder.position.clone());await anim(380,t=>units.forEach((u,i)=>{u.holder.position.set(base[i].x+Math.sin(t*50)*0.16*(1-t),u.sunk?base[i].y:Math.sin(t*Math.PI)*0.35,base[i].z);}));units.forEach((u,i)=>u.holder.position.copy(base[i]));}
async function melee(u,tgt,stop,detour,spin){
  const h=u.holder,p0=h.position.clone(),tp=tgt.holder.position,dir=new THREE.Vector3().subVectors(p0,tp).setY(0).normalize(),p1=tp.clone().addScaledVector(dir,stop);p1.y=0;const r0=h.rotation.y;
  await anim(520,t=>{const e=t*t*(3-2*t);h.position.set(lerp(p0.x,p1.x,e),Math.abs(Math.sin(t*14))*0.1,lerp(p0.z,p1.z,e)+(detour?Math.sin(t*Math.PI)*1.7:0));if(spin)h.rotation.y=r0+e*Math.PI*2;});
  return {p0,r0};
}
async function meleeBack(u,p0,r0,detour){const h=u.holder,p1=h.position.clone();await anim(450,t=>{const e=t*t*(3-2*t);h.position.set(lerp(p1.x,p0.x,e),Math.abs(Math.sin(t*10))*0.08,lerp(p1.z,p0.z,e)+(detour?Math.sin(t*Math.PI)*1.7:0));h.rotation.y=r0;});h.position.copy(p0);}
async function attackAnim(u,mv,foe,miss){
  const tgt=foe.units[0],det=!!obstacle,tp=tgt.holder.position,hp=u.holder.position;
  if(mv.fx==='bite'||mv.fx==='tail'){
    const {p0,r0}=await melee(u,tgt,2.7,det,mv.fx==='tail');
    if(mv.fx==='bite')await anim(300,t=>{u.obj.userData.head.rotation.z=Math.sin(t*Math.PI*2)*0.45;});
    if(!miss)await impact(tp,foe);
    await meleeBack(u,p0,r0,det);
  }else{
    const dir=Math.sign(tp.x-hp.x)||1,from=new THREE.Vector3(hp.x+dir*0.9,u.mouth,hp.z),to=new THREE.Vector3(tp.x-dir*0.5,1.1,tp.z+(det&&!miss?0:0));
    await anim(160,t=>u.holder.scale.setScalar(u.scale*(1+Math.sin(t*Math.PI)*0.2)));
    if(mv.fx==='wave')await rings(from,to,{n:4,size:u.small?0.6:1.2,color:'#bfe8ff',dur:750});
    if(mv.fx==='fire')await particles(from,to,{n:34,size:0.3,cols:['#ff4a1a','#ff9d2e','#ffd23f'],spread:0.9,dur:800,grow:0.6});
    if(mv.fx==='sparks')await particles(from,to,{n:16,size:0.12,cols:['#ffd23f','#ffffff','#ff9d2e'],spread:0.6,dur:600,grav:0.6});
    if(!miss)await impact(tp,foe);
  }
}
async function impact(tp,foe){
  const p=new THREE.Vector3(tp.x,1.2,tp.z);
  if(foe.guard){popText(tp,'DODGED!','#7fd6ff');particles(p,p,{n:8,size:0.12,cols:['#7fd6ff'],spread:1.2,dur:400});return;}
  particles(p,p,{n:16,size:0.15,cols:['#ffffff','#ffd23f','#ff7a2f'],spread:2.2,dur:450,grav:1});await shake(foe.units);
}
async function act(mv){
  if(busy||state!=='fight')return;busy=true;clearBar();
  const k=turn,f=S[k],foe=S[OTHER[k]],u=f.units[k==='chel'?selUnit:0];f.pow-=mv.cost;refreshTags();setMsg(CARDS[k].name+': '+mv.label+'!');
  if(mv.id==='duck'){
    if(u.type==='croc'){u.sunk=true;await anim(450,t=>{u.holder.position.y=-1.15*t;});}
    else await anim(700,t=>{u.holder.position.z=u.home[1]+(u.small?1.5-1.5:0)+Math.sin(t*Math.PI)*1.6;u.holder.position.y=Math.abs(Math.sin(t*Math.PI*2))*1.1;});
    u.holder.position.z=u.home[1];f.guard=true;f.pow=Math.min(3,f.pow+1+(u.small?1:0));
  }else if(mv.id==='heal'){
    const p=u.holder.position;await particles(new THREE.Vector3(p.x,0.2,p.z),new THREE.Vector3(p.x,3.4,p.z),{n:22,size:0.18,cols:['#7dffb0','#ffffff'],spread:2.2,dur:900});
    f.hp=Math.min(6,f.hp+2);popText(p,'+1 ♥','#2fd28a');
  }else{
    const miss=obstacle&&Math.random()<0.4;
    const hpBefore=foe.hp,guarded=foe.guard;
    await attackAnim(u,mv,foe,miss);
    if(miss)popText(centerOf(foe),'Blocked by object!','#ffd23f');
    else if(!guarded){foe.hp=Math.max(0,foe.hp-mv.dmg);popText(centerOf(foe),'-'+(mv.dmg===2?'1':'½')+' ♥','#ff4a5a');}
    else foe.guard=false;
    if(obstacle&&--obstacle.turns<=0)removeObstacle();
  }
  refreshTags();
  if(foe.hp<=0){await ko(foe,f,OTHER[k],k);return;}
  turn=OTHER[k];state='fight';busy=false;await beginTurn(false);
}

// ---------- KO (step 6) ----------
function buildGhost(){const p=Part();ell(p,0,10,0,5,5.5,4,'#ffffff');box(p,-5,5,2,9,-4,4,'#ffffff');for(let x=-5;x<=5;x+=2)box(p,x,x,0,1,-3,3,'#ffffff');
  box(p,-3,-2,10,12,4,4,'#223');box(p,2,3,10,12,4,4,'#223');box(p,-1,1,6,7,4,4,'#223');
  const g=mesh(p);g.traverse(o=>{if(o.isInstancedMesh){o.material.transparent=true;o.material.emissive=new THREE.Color('#9fd8ff');o.castShadow=false;}});const w=new THREE.Group();w.add(g);w.scale.setScalar(0.12);return w;}
async function ko(loser,winner,lk,wk){
  state='ko';setMsg(CARDS[lk].name+' is knocked out!');await sleep(300);
  const ghosts=loser.units.map(u=>{const g=buildGhost();g.position.set(u.holder.position.x,1.2,u.holder.position.z);g.visible=false;scene.add(g);return g;});
  await Promise.all([
    anim(1300,t=>loser.units.forEach(u=>dissolve(u.obj,t,6))),
    sleep(500).then(()=>anim(2000,t=>ghosts.forEach((g,i)=>{g.visible=true;g.position.y=1.2+t*7;g.position.x+=Math.sin(t*9+i)*0.01;g.traverse(o=>{if(o.isInstancedMesh)o.material.opacity=0.85*(1-t*t);});})))]);
  ghosts.forEach(g=>scene.remove(g));loser.units.forEach(u=>u.holder.visible=false);
  drawCard(lk,false);await cardFlash(lk);
  setMsg(CARDS[wk].name+' wins!','The defeated character is back on its card');refreshTags();
  winner.units.forEach(u=>anim(1200,t=>{u.holder.position.y=Math.abs(Math.sin(t*Math.PI*3))*0.9;}));
  clearBar();btn('Play again',reset,{cls:'main'});state='over';
}

// ---------- input ----------
const ray=new THREE.Raycaster(),mp=new THREE.Vector2();let down=null;
renderer.domElement.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,t:performance.now()};});
renderer.domElement.addEventListener('pointerup',e=>{if(!down)return;const dx=e.clientX-down.x,dy=e.clientY-down.y,dt=performance.now()-down.t;down=null;
  if(state==='arm'&&dy<-60&&dt<800){raiseArm();return;}
  if(Math.hypot(dx,dy)>8)return;
  mp.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(mp,cam);
  if(state==='scan'){const h=ray.intersectObjects(Object.values(CARDS).map(c=>c.mesh))[0];if(h){const k=h.object.userData.card;scan(k);}}
  else if(state==='fight'&&!busy){const h=ray.intersectObject(floor)[0];if(h)placeObstacle(h.point.x,h.point.z);}
});

// ---------- loop ----------
const clock=new THREE.Clock();
function tick(){const t=clock.getElapsedTime();
  for(const k in S)for(const u of S[k].units)if(u.holder.visible)idle(u,t);
  for(const k in CARDS){const c=CARDS[k],[x,y]=toScreen(c.x,0.05,c.z-0.4);tagEls[k].style.left=x+'px';tagEls[k].style.top=y+'px';}
  ctl.update();renderer.render(scene,cam);requestAnimationFrame(tick);}
reset();tick();
window.__game={scan,act,get S(){return S},get state(){return state},get turn(){return turn},raiseArm,moveDefs,get busy(){return busy}};
</script>
</body></html>
